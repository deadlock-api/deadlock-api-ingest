[package]
name = "deadlock-api-ingest"
version = "0.3.4"
description = "Deadlock API Ingest"
repository = "https://github.com/deadlock-api/deadlock-api-ingest"
license = "MIT"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
ureq = { version = "3.4.2", default-features = false, features = ["json", "rustls"] }
memchr = "2.8.3"
notify = "8.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
steamlocate = "2.1.1"
dirs = "7.0.0"
walkdir = "2.5.0"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }

# Steam Game Coordinator match-salt recovery (see src/gc/).
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
prost = "0.14"
futures-util = { version = "0.3", default-features = false }
steam-vent = { git = "https://github.com/deadlock-api/steam-vent", rev = "098ae675ab698d642e93c4c650cab79f3fc7d130" }
valveprotos = { git = "https://github.com/deadlock-api/deadlock-api", rev = "328a51b6b1857a9092d3dd1e5c79609a2e61202d", features = [
    "gc-common",
    "gc-client",
    "serde",
] }
# Local Steam session recovery (ConnectCache decrypt).
aes = "0.9"
cbc = { version = "0.2", features = ["alloc"] }
sha2 = "0.11"
crc32fast = "1.4"
hex = "0.4"
base64 = "0.23"
keyvalues-parser = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.56.0"
windows-dpapi = "0.2.0"

[target.'cfg(target_os = "windows")'.build-dependencies]
winres = "0.1"
